name: Profile metrics

on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/metrics.yml"

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Generate profile metrics
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: Afkhomie
          filename: metrics.svg
          output_action: commit
          committer_message: "chore: refresh profile metrics [Skip GitHub Action]"
          base: ""
          plugin_isocalendar: yes
          plugin_languages: yes
          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_activity_days: 14
          plugin_activity_visibility: public
          config_order: isocalendar, languages, activity
          config_timezone: Asia/Kathmandu
          config_display: columns
          config_animations: yes
